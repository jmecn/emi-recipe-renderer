<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>emi-recipe-renderer demo</title>
  <link rel="stylesheet" href="lib/emi.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <header class="demo-header">
    <nav class="demo-tabs" aria-label="Views">
      <a href="#recipes" data-tab="recipes" aria-current="page">Recipes</a>
      <a href="#items" data-tab="items">Items</a>
    </nav>
    <div class="demo-toolbar">
      <label>Language
        <select id="locale-select" aria-label="Language"></select>
      </label>
      <input id="filter-input" type="search" placeholder="Filter…" autocomplete="off" class="demo-filter">
    </div>
    <p id="demo-error" class="demo-error" hidden></p>
  </header>

  <main class="demo-main">
    <section id="panel-recipes" class="demo-panel" data-panel="recipes">
      <div id="recipe-grid" class="recipe-grid"></div>
    </section>

    <section id="panel-items" class="demo-panel" hidden data-panel="items">
      <div id="item-grid" class="item-grid"></div>
    </section>

    <section id="panel-item-detail" class="demo-panel" hidden data-panel="item-detail">
      <div class="item-detail-toolbar">
        <button type="button" id="btn-back-items" class="demo-back">← Items</button>
      </div>
      <header id="item-detail-header" class="item-detail-header"></header>
      <h2 class="demo-section-title">As output</h2>
      <div id="item-outputs" class="recipe-grid recipe-grid-compact"></div>
      <p id="item-outputs-empty" class="demo-empty" hidden>No recipes produce this item.</p>
      <h2 class="demo-section-title">As input</h2>
      <div id="item-inputs" class="recipe-grid recipe-grid-compact"></div>
      <p id="item-inputs-empty" class="demo-empty" hidden>No recipes use this item as input.</p>
    </section>
  </main>

  <div id="tooltip"></div>
  <div id="tag-popover" class="tag-popover" hidden>
    <div class="tag-popover-panel" role="dialog" aria-modal="true">
      <div class="tag-popover-header"></div>
      <div class="tag-popover-stage-wrap"></div>
      <div class="tag-popover-footer"></div>
    </div>
  </div>

  <script src="lib/emi.js"></script>
  <script src="demo-app.js"></script>
</body>
</html>
